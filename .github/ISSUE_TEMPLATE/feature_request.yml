name: Feature request
description: Something Flightpath should do that it does not do yet.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and where did Flightpath fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: The behaviour, screen, or command you have in mind.
    validations:
      required: true
