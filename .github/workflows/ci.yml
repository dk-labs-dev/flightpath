name: CI

# CI is the gate on the public repository: every pull request, every
# push to main and every merge-queue group runs the static checks,
# the build, and the full test matrix on Linux, Windows and macOS.
# The matrices key off the repository's visibility: while it is
# private they run on Linux only, and they widen to all three
# systems the day it turns public, with no edit here.
# One exception: a pull request or a merge-queue group that changes
# only documentation (a Markdown file at the repository root, anything
# under docs/, a package README, or the pull request template) runs
# the static checks and the hygiene checks and skips the build and
# the tests — there is no code in it for them to run on. Pushes and
# manual runs never take the shortcut.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# The default for every job: read the code, change nothing.
permissions:
  contents: read

# Only a pull request's newer run makes its older run's results
# irrelevant, so only pull-request runs cancel in progress. Every
# other event keys its group on the run id, so two runs for the
# same ref — two pushes to main, say — both run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which systems the matrices cover, and which runner each system
  # gets, is decided in one place: scripts/ci-matrix.mjs prints the
  # lists as JSON, and every matrix job reads them from this job's
  # outputs. This job also decides, in the same place, whether the
  # change touches any code at all.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.matrix.outputs.runners }}
      systems: ${{ steps.matrix.outputs.systems }}
      main-matrix: ${{ steps.matrix.outputs.main-matrix }}
      code-changed: ${{ steps.changed.outputs.code-changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: matrix
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/ci-matrix.mjs >> "$GITHUB_OUTPUT"
      # Only a pull request or a merge-queue group can be
      # documentation-only. Its files are the ones its base and head
      # commits differ on. Documentation is a Markdown file at the
      # repository root, anything under docs/, a package README
      # (packages/*/README.md) and .github/pull_request_template.md;
      # every other file, the slash commands' Markdown included, makes
      # the whole change a code change. No files at all counts
      # as a code change, so an odd event runs everything rather
      # than nothing.
      - id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) BASE_SHA="$PR_BASE_SHA"; HEAD_SHA="$PR_HEAD_SHA" ;;
            merge_group) BASE_SHA="$GROUP_BASE_SHA"; HEAD_SHA="$GROUP_HEAD_SHA" ;;
            *)
              echo "code-changed=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Three dots for a pull request: only its own changes, not
          # what the base gained since it branched. Two dots for a
          # group: its head already sits on its base, so the plain
          # difference is exactly the queued changes.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          else
            files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          if [ -z "$files" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              docs/* | packages/[!/]*/README.md | .github/pull_request_template.md) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code-changed=$code" >> "$GITHUB_OUTPUT"

  # The static checks give the same answer on every system, so they
  # run once, on Linux, beside the tests rather than inside them.
  # The steps after the first still run when an earlier one fails,
  # so one run shows every red result instead of the first.
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - if: ${{ !cancelled() }}
        run: pnpm lint
      - if: ${{ !cancelled() }}
        run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm quality

  # The public half of the audit, run as a gate: no AI attribution
  # in any commit message in the change, and no secret in its diff.
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Both checks scan the same commits: the event's change. A
      # first push (or a dispatch) has no usable base, so those scan
      # the single head commit instead of the whole history.
      - shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base='${{ github.event.pull_request.base.sha }}'; head='${{ github.event.pull_request.head.sha }}' ;;
            push) base='${{ github.event.before }}'; head='${{ github.event.after }}' ;;
            merge_group) base='${{ github.event.merge_group.base_sha }}'; head='${{ github.event.merge_group.head_sha }}' ;;
            *) base=''; head="$GITHUB_SHA" ;;
          esac
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            echo "FP_LOG_OPTS=--no-merges $base..$head" >> "$GITHUB_ENV"
          else
            echo "FP_LOG_OPTS=--no-merges -1 $GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      # The patterns bracket one character each, so this file does
      # not itself carry the attribution strings it rejects.
      - name: No AI attribution in commit messages
        shell: bash
        run: |
          git log --format=%B $FP_LOG_OPTS > /tmp/commit-messages.txt
          if grep -inE 'co-authored-b[y]:[^<]*(claude|anthropic|openai|gpt|copilot|codex|gemini|cursor|aider)' /tmp/commit-messages.txt ||
            grep -inE 'generated[[:space:]]with' /tmp/commit-messages.txt ||
            grep -inE 'claude[-]session' /tmp/commit-messages.txt ||
            grep -inE 'claude[.]ai/code' /tmp/commit-messages.txt ||
            grep -inF '🤖' /tmp/commit-messages.txt; then
            echo "AI attribution found in a commit message in this change." >&2
            exit 1
          fi
      # The scanner is a pinned release binary, verified against the
      # publisher's checksum, so the gate itself cannot drift.
      - name: No secrets in the change
        shell: bash
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks git --redact --log-opts="$FP_LOG_OPTS" .
  # Built once per system; the test jobs download the result instead
  # of each rebuilding it. The artifact only passes the build from
  # this run to this run's test jobs, so it is kept for a day.
  build:
    name: build (${{ matrix.os }})
    needs: prepare
    if: ${{ needs.prepare.outputs.code-changed == 'true' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runners)[matrix.os] }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.systems) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.os }}
          path: packages/flightpath/dist
          retention-days: 1

  # The main project, split across parallel jobs per system with
  # Vitest's sharding: three shards on Linux and Windows, two on
  # macOS. The workers setting stays as it was — three on Linux,
  # the default elsewhere, because three overload a two-vCPU
  # Windows runner.
  test-main:
    name: main (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.code-changed == 'true' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runners)[matrix.os] }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.main-matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The artifact holds the built dist folder's contents, so it
      # is extracted back into packages/flightpath/dist itself.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ github.workspace }}/packages/flightpath/dist
      - uses: ./.github/actions/playwright-browsers
        with:
          os: ${{ matrix.os }}
      - env:
          FLIGHTPATH_RETRIED_TESTS_FILE: ${{ runner.temp }}/retried-tests.txt
        run: pnpm --filter @flightpath/flightpath exec vitest run --project main --shard=${{ matrix.shard }}/${{ matrix.total }}${{ matrix.os == 'linux' && ' --maxWorkers=3' || '' }} --reporter=default --reporter=../../scripts/retried-tests-reporter.mjs
      - name: Name the tests that passed only on retry
        if: ${{ !cancelled() }}
        uses: ./.github/actions/retry-summary

  # The view package gets its own job: its suite is quick, and
  # bundling it behind the main shards would delay its answer.
  test-view:
    name: view (${{ matrix.os }})
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.code-changed == 'true' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runners)[matrix.os] }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.systems) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The artifact holds the built dist folder's contents, so it
      # is extracted back into packages/flightpath/dist itself.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ github.workspace }}/packages/flightpath/dist
      - env:
          FLIGHTPATH_RETRIED_TESTS_FILE: ${{ runner.temp }}/retried-tests.txt
        run: pnpm --filter @flightpath/view exec vitest run --reporter=default --reporter=../../scripts/retried-tests-reporter.mjs
      - name: Name the tests that passed only on retry
        if: ${{ !cancelled() }}
        uses: ./.github/actions/retry-summary

  # The budgets and the hook timing gate run in their own job per
  # system, never beside other test files: a wall-clock budget
  # measured next to other work measures that work. They never
  # retry: a budget that passes only on a second try is exactly
  # the drift the numbers are meant to show. Hosted macOS
  # runners have no GPU, so the scroll-frame budgets are logged
  # there but not asserted (FLIGHTPATH_NO_GPU).
  test-timing:
    name: timing (${{ matrix.os }})
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.code-changed == 'true' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runners)[matrix.os] }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.systems) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The artifact holds the built dist folder's contents, so it
      # is extracted back into packages/flightpath/dist itself.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ github.workspace }}/packages/flightpath/dist
      - uses: ./.github/actions/playwright-browsers
        with:
          os: ${{ matrix.os }}
      # Hosted Windows and macOS runners are shared and pause
      # processes, so a missed bound there is logged above, not
      # enforced; Linux enforces the bounds.
      - id: budgets
        continue-on-error: ${{ matrix.os != 'linux' }}
        env:
          FLIGHTPATH_NO_GPU: ${{ matrix.os == 'macos' && '1' || '' }}
        run: pnpm --filter @flightpath/flightpath exec vitest run --project budgets
      # The hook gate borrows the main project's settings, so its
      # no-retry rule is restated on the command line.
      - id: hook-gate
        if: ${{ !cancelled() }}
        continue-on-error: ${{ matrix.os != 'linux' }}
        working-directory: packages/flightpath
        env:
          FLIGHTPATH_TIMING_GATE: "1"
        run: pnpm exec vitest run test/hook-script.test.ts -t "runs fast against a live daemon" --retry=0
      - if: ${{ matrix.os != 'linux' && (steps.budgets.outcome == 'failure' || steps.hook-gate.outcome == 'failure') }}
        shell: bash
        run: echo "A timing bound was missed on this hosted runner; it is logged above, not enforced." >> "$GITHUB_STEP_SUMMARY"

  # The built-in node:sqlite behaves differently across Node release
  # lines, so the files that use it, and the one that checks its
  # experimental warning never reaches the user, also run on the
  # oldest supported release and on the newest. The module is the
  # same on every system, so Linux is enough.
  node-lines:
    name: node-lines (${{ matrix.node }})
    needs: prepare
    if: ${{ needs.prepare.outputs.code-changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.0.0 is one of the lines that print node:sqlite's
        # experimental warning, which the storage tests assert never
        # reaches the user.
        node: ["24.0.0", "latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The warning test loads the compiled storage module.
      - run: pnpm --filter @flightpath/flightpath exec tsc -p tsconfig.build.json
      - env:
          FLIGHTPATH_RETRIED_TESTS_FILE: ${{ runner.temp }}/retried-tests.txt
        run: pnpm --filter @flightpath/flightpath exec vitest run --project node-lines --reporter=default --reporter=../../scripts/retried-tests-reporter.mjs
      - name: Name the tests that passed only on retry
        if: ${{ !cancelled() }}
        uses: ./.github/actions/retry-summary

  # A job skipped before its matrix expands reports under its
  # unexpanded name, never as the individual jobs, so the ruleset
  # requires this one job instead. It passes when every job passed
  # or was skipped, and fails when any job failed or was cancelled.
  ci-passed:
    name: CI passed
    needs:
      - prepare
      - static
      - hygiene
      - build
      - test-main
      - test-view
      - test-timing
      - node-lines
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "These jobs did not pass: $failed" >&2
            exit 1
          fi
