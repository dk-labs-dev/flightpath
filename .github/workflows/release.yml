name: Release

# A pushed `v*` tag becomes a draft GitHub release holding the plugin
# zip and its SHA256SUMS, with notes taken from the tag's CHANGELOG.md
# section. The same build is committed to the tag's channel branch:
# `release` for a plain tag, `next` for a pre-release tag. The plugin
# entry in main's marketplace file pins the release branch, and the
# release branch carries a marketplace file of its own, so both
# channels install through /plugin.
#
# This workflow packages; it does not gate. The local gate run on
# Node 24 decided the tree was good before the tag was pushed, and
# nothing here re-runs the tests.
#
# `workflow_dispatch` exists so the machinery can be dry-run on a fork
# before a real tag: dispatch it from the ref to build, naming the
# tag that ref will carry.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v1.0.0 or v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Work out what this tag builds
        id: plan
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node scripts/release-plan.mjs "$TAG" > plan.json
          {
            echo "tag=$(jq -r .tag plan.json)"
            echo "version=$(jq -r .version plan.json)"
            echo "channel=$(jq -r .channel plan.json)"
            echo "branch=$(jq -r .branch plan.json)"
            echo "prerelease=$(jq -r .prerelease plan.json)"
            echo "zip=$(jq -r .zipName plan.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flightpath/flightpath run build

      - name: Package the plugin zip and its checksums
        env:
          ZIP: ${{ steps.plan.outputs.zip }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          node scripts/package-plugin.mjs "$RUNNER_TEMP/package" --channel "$CHANNEL"
          (cd "$RUNNER_TEMP/package" && zip -r "$GITHUB_WORKSPACE/$ZIP" .)
          sha256sum "$ZIP" > SHA256SUMS

      # The channel branch's root is the packaged marketplace folder:
      # the same files as the zip, committed with plumbing commands
      # rather than a checkout of the branch, so the run never
      # depends on the state main's working tree is in, and the
      # branch gains exactly one commit per release, named by its
      # tag.
      - name: Commit the build to the channel branch
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          node scripts/package-plugin.mjs "$RUNNER_TEMP/branch-files" --channel "$CHANNEL"
          export GIT_INDEX_FILE="$RUNNER_TEMP/branch-index"
          git read-tree --empty
          (cd "$RUNNER_TEMP/branch-files" && GIT_DIR="$GITHUB_WORKSPACE/.git" git add -Af .)
          TREE=$(git write-tree)
          PARENT=""
          if git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            PARENT=$(git rev-parse "origin/$BRANCH")
          fi
          COMMIT=$(
            GIT_AUTHOR_NAME="github-actions[bot]" \
            GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="github-actions[bot]" \
            GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "$TAG"
          )
          git push origin "$COMMIT:refs/heads/$BRANCH"

      - name: Write the release notes from the changelog
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          ZIP: ${{ steps.plan.outputs.zip }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          args=(--draft --title "$TAG" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" "${args[@]}" "$ZIP" SHA256SUMS
