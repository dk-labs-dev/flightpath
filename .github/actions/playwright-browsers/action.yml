name: Playwright browsers
description: >-
  Restores the cached Playwright Chromium for the given system,
  installing it first when the cache is cold.
inputs:
  os:
    description: The matrix system key — linux, windows or macos.
    required: true
runs:
  using: composite
  steps:
    # The key carries the Playwright version, so an upgrade never
    # restores browsers built for the old one. The save is its own
    # step because a failed run must still keep the browsers it
    # downloaded.
    - id: playwright
      shell: bash
      run: echo "version=$(pnpm --filter @flightpath/flightpath exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
    - id: browsers
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ inputs.os == 'linux' && '~/.cache/ms-playwright' || inputs.os == 'macos' && '~/Library/Caches/ms-playwright' || '~/AppData/Local/ms-playwright' }}
        key: playwright-${{ inputs.os }}-${{ steps.playwright.outputs.version }}
    - if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm --filter @flightpath/flightpath exec playwright install --with-deps chromium
    - if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ inputs.os == 'linux' && '~/.cache/ms-playwright' || inputs.os == 'macos' && '~/Library/Caches/ms-playwright' || '~/AppData/Local/ms-playwright' }}
        key: ${{ steps.browsers.outputs.cache-primary-key }}
    # System packages live outside the cached folder, so Linux
    # needs them again even when the browser itself is cached.
    - if: ${{ steps.browsers.outputs.cache-hit == 'true' && inputs.os == 'linux' }}
      shell: bash
      run: pnpm --filter @flightpath/flightpath exec playwright install-deps chromium
