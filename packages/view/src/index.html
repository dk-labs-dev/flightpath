<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var storedTheme = window.localStorage.getItem("flightpath-theme");
        if (storedTheme === "light" || storedTheme === "dark") {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch {
        // Storage blocked: the choice is System.
      }
    </script>
    <title>Flightpath</title>
    <link rel="icon" type="image/svg+xml" href="/view/favicon.svg" />
    <link rel="stylesheet" href="/view/__VIEW_CSS__" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/view/__VIEW_JS__"></script>
  </body>
</html>
